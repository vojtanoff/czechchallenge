<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katetr v heru – nastavení</title>
<style>
:root{--ground:#F9F8F6; --violet:#4B32D0; --violet-soft:#E6E2FA; --linka:#DFDCEF; --tlum:#6F6A8A}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--violet);
  font:15px/1.5 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.lista{position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--linka);
  padding:12px 18px; display:flex; gap:14px; align-items:center; flex-wrap:wrap}
h1{font-size:17px; margin:0}
.tl{border:1px solid var(--violet); background:transparent; color:var(--violet); border-radius:999px;
  padding:7px 16px; cursor:pointer; font:inherit}
.tl:hover{background:var(--violet-soft)}
.tl.plny{background:var(--violet); color:#fff}
.stav{margin-left:auto; font-size:13px; color:var(--tlum)}
.plocha{display:grid; grid-template-columns:1fr 380px; gap:18px; padding:18px; align-items:start}
.ovladani-sloupec{position:sticky; top:64px; max-height:calc(100vh - 80px); overflow:auto}
@media (max-width:1200px){.plocha{grid-template-columns:1fr}}
.ram{background:#fff; border:1px solid var(--linka); border-radius:14px; overflow:hidden}
.ram h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--tlum);
  margin:0; padding:10px 14px; border-bottom:1px solid var(--linka)}
.ram .okno{position:relative; overflow:hidden}
/* iframe má svoji plnou šířku (1440 px) a jen se zmenšuje transformem – kdyby zůstal
   v toku, roztáhl by sloupec a ovládání vpravo by vyjelo mimo obrazovku */
.ram iframe{position:absolute; top:0; left:0}
.ram iframe{border:0; display:block; transform-origin:0 0}
.napoveda{font-size:13px; color:var(--tlum); padding:12px 14px; border-top:1px solid var(--linka)}
.hodnoty{background:#fff; border:1px solid var(--linka); border-radius:14px; padding:14px}
.hodnoty h2{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--tlum); margin:0 0 10px}
.radek{display:grid; grid-template-columns:5.5em 1fr 4.5em; gap:8px; align-items:center; margin-bottom:7px}
.radek input[type=range]{width:100%}
.radek input[type=number]{width:100%; border:1px solid var(--linka); border-radius:8px; padding:4px 7px; font:inherit}
pre{background:var(--ground); border:1px solid var(--linka); border-radius:10px; padding:10px;
  font-size:12px; overflow:auto; margin:12px 0 0}
</style>
</head>
<body>

<div class="lista">
  <h1>Katetr v heru</h1>
  <button class="tl" id="btnReset">Výchozí</button>
  <button class="tl plny" id="btnUlozit">Uložit / zkopírovat</button>
  <span class="stav" id="stav"></span>
</div>

<div class="plocha">
  <div>
    <div class="ram">
      <h2>Počítač · 1440 px</h2>
      <div class="okno" id="oknoPc"><iframe id="ramPc" src="index.html?editor=1"></iframe></div>
    </div>
    <div class="ram" style="margin-top:18px">
      <h2>Mobil · 390 px</h2>
      <div class="okno" id="oknoMob"><iframe id="ramMob" src="index.html?editor=1"></iframe></div>
    </div>
  </div>

  <div class="ovladani-sloupec">
    <div class="hodnoty">
      <h2>Počítač</h2>
      <div class="radek"><label>velikost</label><input type="range" id="pc_zoom" min="30" max="260" step="1"><input type="number" id="pc_zoom_n"></div>
      <div class="radek"><label>úhel</label><input type="range" id="pc_uhel" min="-90" max="90" step="1"><input type="number" id="pc_uhel_n"></div>
      <div class="radek"><label>vodorovně</label><input type="range" id="pc_x" min="-80" max="80" step="1"><input type="number" id="pc_x_n"></div>
      <div class="radek"><label>svisle</label><input type="range" id="pc_y" min="-80" max="80" step="1"><input type="number" id="pc_y_n"></div>
    </div>
    <div class="hodnoty" style="margin-top:18px">
      <h2>Mobil</h2>
      <div class="radek"><label>velikost</label><input type="range" id="m_zoom" min="30" max="260" step="1"><input type="number" id="m_zoom_n"></div>
      <div class="radek"><label>úhel</label><input type="range" id="m_uhel" min="-90" max="90" step="1"><input type="number" id="m_uhel_n"></div>
      <div class="radek"><label>vodorovně</label><input type="range" id="m_x" min="-80" max="80" step="1"><input type="number" id="m_x_n"></div>
      <div class="radek"><label>svisle</label><input type="range" id="m_y" min="-80" max="80" step="1"><input type="number" id="m_y_n"></div>
      <pre id="vypis"></pre>
    </div>
    <p class="napoveda" style="border:0; padding-left:0">Všechno je v procentech. Šířka je vůči sloupci, posun vůči šířce obrázku. V náhledech jde katetrem i táhnout myší.</p>
  </div>
</div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var VYCHOZI = { pc:{x:0,y:0,zoom:100,uhel:34}, mobil:{x:0,y:0,zoom:100,uhel:34} };
  var stav = JSON.parse(JSON.stringify(VYCHOZI));

  // náhledy: iframe v plné šířce zmenšený na místo, které je k dispozici
  // Náhled ukazuje jen oblast hera – celá stránka není potřeba a zabírala by výšku,
  // kvůli které by při pohledu na mobil zmizelo ovládání.
  function zmensi(id, okno, w, h, vidno){
    var r = $(id), o = $(okno);
    r.style.width = w+"px"; r.style.height = h+"px";
    var k = Math.min(1, o.clientWidth / w);
    r.style.transform = "scale("+k+")";
    r.style.left = Math.max(0, (o.clientWidth - w*k) / 2) + "px";
    o.style.height = ((vidno||h)*k)+"px";
  }
  function preskaluj(){
    zmensi("#ramPc","#oknoPc",1440,900,760);
    zmensi("#ramMob","#oknoMob",390,900,720);
  }
  addEventListener("resize", preskaluj);

  var pole = [["pc_zoom","pc","zoom"],["pc_uhel","pc","uhel"],["pc_x","pc","x"],["pc_y","pc","y"],
              ["m_zoom","mobil","zoom"],["m_uhel","mobil","uhel"],["m_x","mobil","x"],["m_y","mobil","y"]];

  function doPoli(){
    pole.forEach(function(p){
      var v = stav[p[1]][p[2]];
      $("#"+p[0]).value = v; $("#"+p[0]+"_n").value = v;
    });
    $("#vypis").textContent = JSON.stringify(stav, null, 1);
  }
  function posli(){
    [$("#ramPc"), $("#ramMob")].forEach(function(r){
      try { r.contentWindow.postMessage({__katetr: stav}, "*"); } catch(e){}
    });
  }
  function zmena(){ doPoli(); posli(); $("#stav").textContent = "neuloženo"; }

  pole.forEach(function(p){
    function nastav(v){ stav[p[1]][p[2]] = Math.round(+v||0); zmena(); }
    $("#"+p[0]).addEventListener("input", function(e){ nastav(e.target.value); });
    $("#"+p[0]+"_n").addEventListener("change", function(e){ nastav(e.target.value); });
  });

  $("#btnReset").addEventListener("click", function(){
    stav = JSON.parse(JSON.stringify(VYCHOZI)); zmena();
  });

  // Na GitHub Pages není server, kam uložit – tam se hodnoty zkopírují do schránky
  // a Vojta je pošle. Z náhledu na Macu se uloží rovnou do katetr.json.
  $("#btnUlozit").addEventListener("click", function(){
    var text = JSON.stringify(stav);
    fetch("katetr.json", { method:"POST", headers:{"Content-Type":"application/json","X-Katetr":"1"},
                           body: text })
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(){ $("#stav").textContent = "uloženo " + new Date().toLocaleTimeString("cs-CZ"); })
      .catch(function(){
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(function(){ $("#stav").textContent = "server tu není – hodnoty zkopírované, pošli mi je"; },
                function(){ $("#stav").textContent = "server tu není – hodnoty jsou dole, opiš je"; });
      });
  });

  // tažení přímo v náhledu
  addEventListener("message", function(e){
    if(!e.data || !e.data.__katetrTah) return;
    var t = e.data.__katetrTah, kde = t.pc ? "pc" : "mobil";
    stav[kde].x = Math.round(t.x); stav[kde].y = Math.round(t.y);
    zmena();
  });

  fetch("katetr.json",{cache:"no-store"}).then(function(r){ return r.ok?r.json():null; })
    .then(function(v){ if(v){ stav = Object.assign(JSON.parse(JSON.stringify(VYCHOZI)), v); }
      doPoli(); preskaluj(); setTimeout(posli, 900); })
    .catch(function(){ doPoli(); preskaluj(); });
})();
</script>
<div style="position:fixed;left:12px;bottom:12px;z-index:60;background:#4B32D0;color:#fff;font:500 12px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:999px;pointer-events:none">working draft</div>
</body>
</html>
